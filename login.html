<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InvenList</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>
     <div class="wholeLoginPage">

        <div class="backWarehouse"></div>

     <nav>

        <div class="logo">
        <img src="images/logo.png" alt="logo">

            <div class="logoWords">
            <h2>InvenList</h2>
            <p>Inventory Management System</p>
            </div>
        </div>

         <div class="navLinks">
             <a href="index.html">Home</a>
             <a href="#">Features</a>
             <a href="#">About</a>
         </div>

     </nav>

     <div class="loginArea">

          <div class="loginBox">

           <h1>Welcome Back</h1>
           <p class="smallText">
            Login to continue to InvenList
           </p>

           <form id="myForm">

            <label for="mailBox">Email</label>
            <input type="email" id= "mailBox" placeholder="Enter your email">

            <label for="passBox">Password</label>
            <input type="password" id="passBox" placeholder="Enter your password">

            <button type="submit" class="logMeInBtn">Login</button>

           </form>

           <p class="goSignup"> Don't have an account?
           <a href="#">Sign Up</a>
           </p>

          </div>

     </div>

     </div>

     <script src="login.js"></script>

</body>
</html>
